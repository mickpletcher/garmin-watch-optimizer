schema_version: "1.0"
profile:
  name: Enduro 2 Daily
  description: Portable read-only desired state example
target:
  manufacturer: Garmin
  models:
    - Enduro 2
  minimum_firmware: null
apply_policy:
  mode: merge
  backup_before_apply: true
  verify_after_apply: true
  unsupported: report
  require_confirmation_for_high_risk: true
settings:
  activities.favorites:
    - trail_run
    - bike
  power.battery_saver: auto
  system.language: English
  system.time_format: 24_hour
  system.timezone: auto_gps
  system.units: Metric

# Validation, comparison, and planning are read only. Plans never contain an
# automatic operation because no physical write adapter exists.
